<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Anniversary 💗</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #fff0f5;
            font-family: Arial, sans-serif;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            font-family: "Brush Script MT", cursive;
            font-size: 60px;
            color: #d45a7a;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            color: #777;
        }

        button {
            margin-top: 25px;
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            background: #d45a7a;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>♡ Happy Anniversary ♡</h1>
        <p>To my favorite person... 💗</p>
        <button onclick="openLetter()">Open it 🎀</button>
    </div>
<script>
    function openLetter() {
        alert("A little something made just for you 💗");
    }
</script>
</body>
</html>
